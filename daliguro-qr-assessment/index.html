<!doctype html>
<html lang="en">
  <head>
    <!-- React Fast Refresh preamble + app entry in ONE module script.
         plugin-react does not auto-inject the preamble under this Vite
         version, and a separate entry <script> races the preamble's
         top-level await (HTML module scripts don't wait on an earlier
         script's TLA), which intermittently threw "$RefreshReg$ is not
         defined" and rendered a blank page in dev. Chaining the entry
         import after the preamble in the same module makes the order
         deterministic; the DEV branch compiles away in production. -->
    <script type="module">
      if (import.meta.env.DEV) {
        const { injectIntoGlobalHook } = await import("/@react-refresh");
        injectIntoGlobalHook(window);
        window.$RefreshReg$ = () => {};
        window.$RefreshSig$ = () => (type) => type;
      }
      await import("/src/main.tsx");
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DALIguro SmartScan</title>

    <!-- PWA: installable + offline app shell -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4338ca" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DALIguro SmartScan" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
